<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statystyki - RRB</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111;
            color: white;
            font-family: 'Press Start 2P', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* BACK BUTTON */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: #ff0055;
            color: white;
            text-decoration: none;
            padding: 15px 25px;
            font-size: 10px;
            border: 2px solid white;
            box-shadow: 0 0 10px #ff0055;
            transition: all 0.3s;
        }

        .back-btn:hover {
            transform: scale(1.1);
            background: #ff0000;
        }

        .stats-container {
            width: 800px;
            background: #222;
            border: 4px solid #00ffff;
            padding: 40px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.2);
        }

        h1 {
            color: #00ffff;
            text-align: center;
            margin-bottom: 40px;
            text-shadow: 4px 4px #000;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .stat-box {
            background: #111;
            padding: 20px;
            border: 2px solid #555;
            text-align: center;
        }

        .stat-label {
            color: #aaa;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .stat-value {
            color: #fff;
            font-size: 24px;
            text-shadow: 0 0 10px white;
        }

        .highlight {
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
        }

        .highlight-red {
            color: #ff0055;
            text-shadow: 0 0 10px #ff0055;
        }

        .profile-name {
            text-align: center;
            margin-bottom: 20px;
            color: #ffff00;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <a href="#" class="back-btn"
        onclick="event.preventDefault(); if (window.parent && window.parent.closeSubpage) { window.parent.closeSubpage(); } else { window.location.href='index.html?view=playerMenu'; }">
        🛑 WRÓĆ
    </a>

    <div class="stats-container">
        <h1>STATYSTYKI GRACZA</h1>
        <div class="profile-name" id="profileName">DEFAULT</div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">RESPECT (EXP)</div>
                <div class="stat-value highlight" id="statRespect">0</div>
            </div>

            <div class="stat-box">
                <div class="stat-label">KASA (MK)</div>
                <div class="stat-value highlight" id="statMoney">0</div>
            </div>

            <div class="stat-box">
                <div class="stat-label">KARTY W KOLEKCJI</div>
                <div class="stat-value" id="statCards">0</div>
            </div>

            <div class="stat-box">
                <div class="stat-label">WYGRANE WALKI</div>
                <div class="stat-value" id="statWins">0</div>
            </div>

            <div class="stat-box">
                <div class="stat-label">PRZEGRANE</div>
                <div class="stat-value highlight-red" id="statLosses">0</div>
            </div>

            <div class="stat-box">
                <div class="stat-label">ODBL. ACHIEVEMENTY</div>
                <div class="stat-value" id="statAchievs">0/0</div>
            </div>
        </div>

        <button onclick="shareStats()"
            style="display: block; width: 100%; margin-top: 40px; padding: 20px; background: #00ffff; color: black; border: 2px solid white; font-family: 'Press Start 2P'; font-size: 14px; cursor: pointer; box-shadow: 0 0 20px rgba(0,255,255,0.4);">
            📸 UDOSTĘPNIJ STATYSTYKI
        </button>
    </div>

    <script src="js/AuthManager.js"></script>
    <script src="js/CollectionManager.js?v=75"></script>
    <script src="js/data/achievements.js?v=75"></script>
    <script src="js/AchievementManager.js?v=75"></script>
    <script src="js/data/tracks.js?v=75"></script>
    <script src="js/classes/AudioManager.js?v=75"></script>
    <script src="js/ui/RadioBar.js?v=75"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="js/CardGenerator.js?v=75"></script>
    <script src="js/managers/StatsManager.js?v=75"></script>
    <script>
        // Init managers
        window.authManager = new AuthManager();
        const collectionManager = new CollectionManager();
        const achievementManager = new AchievementManager();
        const statsManager = new StatsManager();
        const cardGen = new CardGenerator();

        async function init() {
            // 1. Get profile from URL or parent
            const urlParams = new URLSearchParams(window.location.search);
            let profile = urlParams.get('profile');
            if (!profile && window.parent && window.parent.getActiveProfile) {
                profile = window.parent.getActiveProfile();
            }
            if (!profile) profile = localStorage.getItem('rrb_current_profile') || 'default';

            document.getElementById('profileName').innerText = profile.toUpperCase();

            // 2. Fetch managers from Parent (RAM) or Local context (Fallback)
            const cm = (window.parent && window.parent.collectionManager && window.parent.collectionManager.isInitialized) ? window.parent.collectionManager : collectionManager;
            const am = (window.parent && window.parent.achievementManager && window.parent.achievementManager.isInitialized) ? window.parent.achievementManager : achievementManager;
            const sm = (window.parent && window.parent.statsManager) ? window.parent.statsManager : statsManager;

            // 3. Fallback Init if standalone
            if (cm === collectionManager) {
                if (cm.currentProfile !== profile) await cm.switchProfile(profile);
                else await cm.init();
            }
            if (am === achievementManager) await am.init();
            if (sm === statsManager) sm.refreshProfile();

            // 4. Gather Data
            const money = cm.getMoney();
            const cStats = cm.getStats();
            const totalCards = cStats.uniqueCards || 0;

            const aStats = am.getStats();
            const unlockedCount = aStats.unlocked || 0;
            const totalAchievs = aStats.total || 0;

            const rpgStats = sm.stats.rpg || {};
            const respect = rpgStats.respect || 0;

            const battleStats = sm.stats.battle || {};
            const wins = battleStats.wins || 0;
            const losses = battleStats.losses || 0;

            // 5. Render
            document.getElementById('statMoney').innerText = money + " MK";

            // Allow checking global database length safely
            const dbLength = (typeof CARDS_DATABASE !== 'undefined') ? CARDS_DATABASE.length :
                (window.parent && typeof window.parent.CARDS_DATABASE !== 'undefined') ? window.parent.CARDS_DATABASE.length : 0;

            document.getElementById('statCards').innerText = `${totalCards}/${dbLength}`;
            document.getElementById('statWins').innerText = wins;
            document.getElementById('statLosses').innerText = losses;
            document.getElementById('statRespect').innerText = respect;
            document.getElementById('statAchievs').innerText = `${unlockedCount}/${totalAchievs}`;
        }

        function shareStats() {
            cardGen.shareFullCollection('.stats-container');
        }

        init();
    </script>
</body>

</html>
